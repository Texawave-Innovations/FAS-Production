name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    env:
      # packages/database's `build` (prisma generate) needs DATABASE_URL to
      # be *present* to load its Prisma config — it does not need a reachable
      # database (verified: `prisma generate` against this unreachable URL
      # succeeds). apps/api's own build/lint/typecheck/unit-test don't touch
      # env vars at all (its env schema is validated at app-boot time, which
      # none of these tasks do) — DATABASE_URL is the one exception.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/fas_erp_ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build

  ui-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter ui exec playwright install --with-deps chromium

      - name: Build ui and its workspace dependencies
        # @fas-erp/core and @fas-erp/ui-kit resolve via their package.json
        # main/exports to ./dist, which only exists after `build` runs — this
        # job's `pnpm install` is independent of the lint-typecheck-test-build
        # job's, so without this, `pnpm dev` below can't resolve
        # "@fas-erp/core" (Module not found) even though it typechecks and
        # builds fine in the other job's turbo run.
        run: pnpm exec turbo run build --filter=ui...

      - name: Responsive + light/dark smoke test (apps/ui/e2e)
        # playwright.config.ts starts the Next dev server itself and only
        # exercises the login page's static rendering — no backend/DB
        # dependency (see that file's own comment).
        run: pnpm --filter ui test:e2e
